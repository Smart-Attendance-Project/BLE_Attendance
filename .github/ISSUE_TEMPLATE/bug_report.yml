name: "Bug Report"
description: "Report a bug or unexpected behavior"
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ## Bug Report
        Thanks for taking the time to report a bug! Please fill in the details below.

- type: textarea
    id: Description 
    attributes:
      label: "Description "
      description: "Describe the architectural change or technical debt."
    validations:
      required: true


  - type: textarea
    id: proposed-design
    attributes:
      label: "Proposed Design"
      description: "Describe the new architecture or approach."
    validations:
      required: true

  

  - type: textarea
    id: acceptance
    attributes:
      label: "Acceptance Criteria"
      placeholder: |
        - [ ] Criteria 1
        - [ ] Criteria 2
    validations:
      required: true
