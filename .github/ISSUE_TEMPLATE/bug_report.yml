name: "Bug Report"
description: "Report a bug or unexpected behavior"
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ## Bug Report
        Thanks for taking the time to report a bug! Please fill in the details below.

  - type: textarea
    id: overview
    attributes:
      label: "Overview"
      description: "A clear summary of what the bug is."
      placeholder: "Describe the bug..."
    validations:
      required: true

  - type: textarea
    id: root-cause
    attributes:
      label: "Root Cause Analysis"
      description: "If known, describe the technical root cause."
      placeholder: "What causes this bug?"
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: "Steps to Reproduce"
      description: "Step-by-step instructions to reproduce the issue."
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "Expected Behavior"
      description: "What should happen?"
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: "Actual Behavior"
      description: "What actually happens?"
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: "Affected Component"
      options:
        - "Mobile App (Flutter)"
        - "Backend (FastAPI)"
        - "Frontend (Web Dashboard)"
        - "BLE Communication"
        - "Other"
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: "Environment"
      description: "Device, OS version, app version, etc."
      placeholder: |
        - Device: Realme 12 Pro
        - Android: 14
        - App version: 1.0.0
    validations:
      required: false

  - type: textarea
    id: solution
    attributes:
      label: "Proposed Solution"
      description: "If you have a fix in mind, describe it here."
    validations:
      required: false

  - type: checkboxes
    id: acceptance
    attributes:
      label: "Acceptance Criteria"
      description: "What needs to be true for this to be considered fixed?"
      options:
        - label: "Bug no longer reproducible with the steps above"
