name: "Architecture / Design"
description: "Propose a system design change or discuss technical debt"
title: "arch: "
labels: ["architecture"]
body:
  - type: markdown
    attributes:
      value: |
        ## Architecture / Design Discussion
        Use this for system-level design proposals, refactoring, or technical debt.

  - type: textarea
    id: Description 
    attributes:
      label: "Description "
      description: "Describe the architectural change or technical debt."
    validations:
      required: true


  - type: textarea
    id: proposed-design
    attributes:
      label: "Proposed Design"
      description: "Describe the new architecture or approach."
    validations:
      required: true

  

  - type: textarea
    id: acceptance
    attributes:
      label: "Acceptance Criteria"
      placeholder: |
        - [ ] Criteria 1
        - [ ] Criteria 2
    validations:
      required: true
