name: Architecture proposal
description: Propose a system design change or discuss technical debt
title: "arch: "
labels:
  - architecture
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the technical debt, architectural challenge, or context.
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: Describe the proposed architecture or technical solution.
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: Define the acceptance criteria or conditions for completion.
      placeholder: |
        - [ ] Criteria 1
        - [ ] Criteria 2
    validations:
      required: true
