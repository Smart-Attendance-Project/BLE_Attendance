services:
  - type: web
    name: ble-attendance
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && bash scripts/build_native.sh && python scripts/seed_full.py
    startCommand: ./build/native/attendance-api
    envVars:
      - key: PYTHONPATH
        value: .
      - key: DATABASE_URL_OVERRIDE
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: false
    healthCheckPath: /health
    autoDeploy: true
